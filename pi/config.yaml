# Robot configuration — pins, thresholds and speeds all live here.
# Sections get added as each subsystem is built.

serial:
  # Find the right port on the Pi with:  ls -l /dev/serial/by-id/
  # Using the /dev/serial/by-id/... path is best: it never changes between reboots.
  port: /dev/ttyUSB0
  baud: 115200
  ready_timeout_s: 5.0   # how long to wait for the ESP32 to say READY after connecting
  link_timeout_s: 0.5    # no message from the ESP32 for this long = link is dead
  move_rate_hz: 10       # how often MOVE is repeated while driving (ESP32 stops after 300 ms of silence)

# Wiring: OPTION A — sensors wired straight to the Pi 40-pin header.
# GPIO numbers are BCM numbers (what gpiozero uses), not physical pin numbers.
hardware:
  i2c_bus: 1               # physical pins 3 (SDA) and 5 (SCL)
  imu_address: 0x28        # BNO055 default — confirm with: i2cdetect -y 1
  cliff_address: 0x29      # VL53L0X default — confirm with: i2cdetect -y 1
  pir_gpio: 27             # physical pin 13
  lights_gpio: 17          # physical pin 11, MOSFET trigger (PWM)

camera:
  # "picamera" = Pi Camera Module v2.1 (imx219) on the ribbon cable — the main camera.
  # "usb"      = USB webcam (e.g. Logitech), index 0 = first one found.
  source: picamera
  usb_index: 0

drive:
  test_speed: 0.3        # fraction of max speed used by the test scripts

logging:
  file: logs/robot.log   # relative to the pi/ folder
  level: INFO
